
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CLINACAP</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-placeholder">CLINACAP</div>
        <div class="subtitle">Clínica de Salud - Proyecto INACAP</div>

        <form>
            <div class="form-group">
                <label for="Nombre">Nombre completo </label>
                <input type="text" id="Nombre" name="Nombre" placeholder="Scott Aguilar" required>
            </div>

            <div class="form-group">
                <label for="Correo">Correo Electronico</label>
                <input type="text" id="Correo" name="Correo" placeholder="Scott.aguilar@gmail.com" required>
            </div>

        
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>

            
            <div class="form-group">
                <label for="confirmarPass">Repetir Contraseña</label>
                <input type="confirmarPass" id="confirmarPass" name="confirmarPass" placeholder="********" required>
            </div>

            <button [routerLink]="['/login']" type="submit" class="btn-login">Registrate</button>
        </form>

        <div class="footer-links">
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
           <p>¿tienes cuenta? <a [routerLink]="['/login']">inicia sesion</a></p>
        </div>
    </div>

</body>
</html>

<div class="login-container">
    <div class="logo-placeholder">CLINACAP</div>
    <div class="subtitle">Clínica de Salud - Proyecto INACAP</div>

    <form (ngSubmit)="iniciarSesion()">
        <div *ngIf="errorMessage" class="error-message-global">
            ⚠️ {{ errorMessage }}
        </div>

        <div class="form-group">
            <label for="usuario">Usuario o Correo Institucional</label>
            <input type="text" 
                [(ngModel)]="userEmail" 
                name="userEmail" 
                id="usuario" 
                placeholder="ejemplo@inacap.cl" 
                required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" 
                [(ngModel)]="userPass" 
                name="userPass" 
                id="password" 
                placeholder="********" 
                required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <div class="footer-links">
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a [routerLink]="['/registro']">Solicitar acceso</a></p>
    </div>
</div>
